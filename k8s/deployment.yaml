apiVersion: apps/v1
kind: Deployment
metadata:
  name: bakstg-nodejs-demo2
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: bakstg-nodejs-demo2
    app.kubernetes.io/instance: bakstg-nodejs-demo2-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: kube-demo-2026
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/created-by: backstage-scaffolder
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    source-project: bakstg-nodejs-demo2
    owner: platform-team
    backstage.io/kubernetes-id: bakstg-nodejs-demo2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bakstg-nodejs-demo2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bakstg-nodejs-demo2
        app.kubernetes.io/instance: bakstg-nodejs-demo2-prod
        app.kubernetes.io/component: backend-api
        environment: sandbox
        owner: platform-team
        backstage.io/kubernetes-id: bakstg-nodejs-demo2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        fluentd.io/collect: "true"
        fluentd.io/parser: "json"
        fluentd.io/destination: "loki"
    spec:
      containers:
        - name: bakstg-nodejs-demo2
          image: ghcr.io/cirodasilvaj/bakstg-nodejs-demo2:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: "bakstg-nodejs-demo2"
            - name: FLUENTD_HOST
              value: "fluentd.logging.svc.cluster.local"
            - name: FLUENTD_PORT
              value: "24224"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bakstg-nodejs-demo2
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: bakstg-nodejs-demo2
    app.kubernetes.io/part-of: kube-demo-2026
    app.kubernetes.io/managed-by: argocd
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    owner: platform-team
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bakstg-nodejs-demo2
  ports:
    - name: http
      port: 8080
      targetPort: 8080
