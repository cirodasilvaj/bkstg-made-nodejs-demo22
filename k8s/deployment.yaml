apiVersion: apps/v1
kind: Deployment
metadata:
  name: bkstg-made-nodejs-demo22
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: bkstg-made-nodejs-demo22
    app.kubernetes.io/instance: bkstg-made-nodejs-demo22-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: kube-demo-2026
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/created-by: backstage-scaffolder
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    source-project: bkstg-made-nodejs-demo22
    owner: platform-team
    backstage.io/kubernetes-id: bkstg-made-nodejs-demo22
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bkstg-made-nodejs-demo22
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bkstg-made-nodejs-demo22
        app.kubernetes.io/instance: bkstg-made-nodejs-demo22-prod
        app.kubernetes.io/component: backend-api
        environment: sandbox
        owner: platform-team
        backstage.io/kubernetes-id: bkstg-made-nodejs-demo22
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        fluentd.io/collect: "true"
        fluentd.io/parser: "json"
        fluentd.io/destination: "loki"
    spec:
      containers:
        - name: bkstg-made-nodejs-demo22
          image: ghcr.io/cirodasilvaj/bkstg-made-nodejs-demo22:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_NAME
              value: "bkstg-made-nodejs-demo22"
            - name: FLUENTD_HOST
              value: "fluentd.logging.svc.cluster.local"
            - name: FLUENTD_PORT
              value: "24224"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bkstg-made-nodejs-demo22
  namespace: apps-demo
  labels:
    app.kubernetes.io/name: bkstg-made-nodejs-demo22
    app.kubernetes.io/part-of: kube-demo-2026
    app.kubernetes.io/managed-by: argocd
    environment: sandbox
    cost-center: devops-platform-cloud
    cloud-provider: aws
    owner: platform-team
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bkstg-made-nodejs-demo22
  ports:
    - name: http
      port: 8080
      targetPort: 8080
